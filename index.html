<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Camera's</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08111f;color:#f5f7fb;font-family:Arial,sans-serif}
header{background:#101d30;padding:18px;border-bottom:2px solid #168bff}
h1{margin:0;font-size:22px;color:#42a5ff}
small{color:#a8b8cc}
main{max-width:1100px;margin:auto;padding:16px}
.card{background:#122238;border:1px solid #263e5d;border-radius:13px;padding:16px;margin:12px 0}
input,select,button{width:100%;padding:13px;margin:6px 0;border-radius:8px;border:1px solid #38516f;background:#0b1728;color:white;font-size:15px}
button{background:#087bea;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#263e5d}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
nav button{font-size:13px;padding:12px 5px}
.hidden{display:none!important}
.stat{display:inline-block;background:#0b1728;padding:13px;border-radius:9px;margin:4px;min-width:130px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;border-bottom:1px solid #30445e;text-align:right}
.tablewrap{overflow:auto}
label{display:block;margin-top:10px;color:#c9d9ed}
#message{padding:10px;color:#ffd36a}
</style>
</head>
<body>
<header>
<h1>SECURITY CAMERA'S</h1>
<small>نظام إدارة المبيعات والمخازن والصيانة</small>
</header>

<main>
<section id="login" class="card">
<h2>تسجيل الدخول</h2>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
<div id="loginMsg"></div>
</section>

<section id="app" class="hidden">
<div class="card">
<strong id="welcome">أهلاً بك</strong>
<button class="secondary" onclick="logout()">تسجيل الخروج</button>
</div>

<nav>
<button onclick="showPage('home')">الرئيسية</button>
<button onclick="showPage('products')">المنتجات</button>
<button onclick="showPage('customers')">العملاء</button>
<button onclick="showPage('suppliers')">الموردين</button>
<button onclick="showPage('expenses')">المصروفات</button>
<button onclick="showPage('invoices')">الفواتير</button>
<button onclick="showPage('stock')">المخزون</button>
<button onclick="showPage('reports')">التقارير</button>
</nav>

<div id="message"></div>

<section id="home" class="page card">
<h2>لوحة التحكم</h2>
<div id="stats">جاري تحميل البيانات...</div>
</section>

<section id="products" class="page card hidden">
<h2>إضافة منتج</h2>
<input id="pname" placeholder="اسم المنتج / نوع الكاميرا">
<input id="pcode" placeholder="كود المنتج">
<input id="pcost" type="number" min="0" placeholder="سعر الشراء">
<input id="psell" type="number" min="0" placeholder="سعر البيع">
<button onclick="addProduct()">حفظ المنتج</button>
<h3>المنتجات المسجلة</h3>
<div id="productsList" class="tablewrap"></div>
</section>

<section id="customers" class="page card hidden">
<h2>إضافة عميل</h2>
<input id="cname" placeholder="اسم العميل">
<input id="cphone" placeholder="رقم الهاتف">
<input id="caddress" placeholder="العنوان">
<input id="cnotes" placeholder="ملاحظات">
<button onclick="addCustomer()">حفظ العميل</button>
<h3>العملاء</h3>
<div id="customersList" class="tablewrap"></div>
</section>

<section id="suppliers" class="page card hidden">
<h2>إضافة مورد</h2>
<input id="sname" placeholder="اسم المورد">
<input id="sphone" placeholder="رقم الهاتف">
<input id="saddress" placeholder="العنوان">
<button onclick="addSupplier()">حفظ المورد</button>
<h3>الموردين</h3>
<div id="suppliersList" class="tablewrap"></div>
</section>

<section id="expenses" class="page card hidden">
<h2>تسجيل مصروف</h2>
<input id="etitle" placeholder="بيان المصروف">
<input id="eamount" type="number" min="0" placeholder="المبلغ">
<select id="epayment">
<option value="cash">نقدي</option>
<option value="vodafone_cash">فودافون كاش</option>
<option value="bank_transfer">تحويل بنكي</option>
</select>
<input id="enotes" placeholder="ملاحظات">
<button onclick="addExpense()">حفظ المصروف</button>
<h3>المصروفات</h3>
<div id="expensesList" class="tablewrap"></div>
</section>

<section id="invoices" class="page card hidden">
<h2>الفواتير</h2>
<p>عرض الفواتير المسجلة وحالتها.</p>
<div id="invoicesList" class="tablewrap"></div>
</section>

<section id="stock" class="page card hidden">
<h2>أرصدة المخزون</h2>
<div id="stockList" class="tablewrap"></div>
</section>

<section id="reports" class="page card hidden">
<h2>التقارير</h2>
<div id="reportsList"></div>
</section>
</section>
</main>

<script>
const SUPABASE_URL = "https://tzlboqssxmkpdrgkzoyb.supabase.co";
const SUPABASE_KEY = "sb_publishable_8fxAj-xFVZudD2xM96Qo-g_VoQnVBb7";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentRole = null;

function msg(t){
 document.getElementById("message").textContent=t;
}
function safe(v){
 return String(v ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function money(v){
 return Number(v||0).toLocaleString("ar-EG")+" ج.م";
}
function table(rows,cols){
 if(!rows || !rows.length) return "<p>لا توجد بيانات حتى الآن</p>";
 return "<table><thead><tr>"+cols.map(c=>"<th>"+c[1]+"</th>").join("")+
 "</tr></thead><tbody>"+rows.map(r=>"<tr>"+cols.map(c=>"<td>"+safe(r[c[0]])+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
}
function showPage(id){
 document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 loadPage(id);
}
async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const out=document.getElementById("loginMsg");
 out.textContent="جاري تسجيل الدخول...";
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){out.textContent=error.message;return;}
 await startApp();
}
async function logout(){
 await db.auth.signOut();
 location.reload();
}
async function startApp(){
 const {data:{user}}=await db.auth.getUser();
 if(!user){document.getElementById("login").classList.remove("hidden");return;}
 const {data:roleRow,error}=await db.from("user_roles")
   .select("role").eq("user_id",user.id).maybeSingle();
 if(error || !roleRow){
   await db.auth.signOut();
   document.getElementById("loginMsg").textContent="الحساب ليس له صلاحية دخول للنظام. تواصل مع المدير.";
   return;
 }
 currentRole=roleRow.role;
 document.getElementById("login").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("welcome").textContent=
   "أهلاً بك — "+(currentRole==="admin"?"مدير النظام":"موظف");
 showPage("home");
}
async function loadPage(id){
 msg("");
 if(id==="home") return loadStats();
 if(id==="products") return loadProducts();
 if(id==="customers") return loadCustomers();
 if(id==="suppliers") return loadSuppliers();
 if(id==="expenses") return loadExpenses();
 if(id==="invoices") return loadInvoices();
 if(id==="stock") return loadStock();
 if(id==="reports") return loadReports();
}
async function loadStats(){
 const names=["products","customers","invoices","expenses"];
 const counts=await Promise.all(names.map(async t=>{
  const {count,error}=await db.from(t).select("*",{count:"exact",head:true});
  return error?"—":count;
 }));
 document.getElementById("stats").innerHTML=
  names.map((n,i)=>`<div class="stat">${["المنتجات","العملاء","الفواتير","المصروفات"][i]}<h2>${counts[i]}</h2></div>`).join("");
}
async function addProduct(){
 const name=document.getElementById("pname").value.trim();
 const code=document.getElementById("pcode").value.trim();
 const purchase_price=Number(document.getElementById("pcost").value||0);
 const selling_price=Number(document.getElementById("psell").value||0);
 if(!name)return msg("اكتب اسم المنتج");
 const {error}=await db.from("products").insert({
  name, "كود":code||null,purchase_price,selling_price
 });
 if(error)return msg(error.message);
 ["pname","pcode","pcost","psell"].forEach(id=>document.getElementById(id).value="");
 msg("تم حفظ المنتج بنجاح");
 loadProducts();loadStats();
}
async function loadProducts(){
 const {data,error}=await db.from("products")
 .select("name,كود,purchase_price,selling_price,created_at").order("created_at",{ascending:false});
 document.getElementById("productsList").innerHTML=error?safe(error.message):
 table(data,[["name","المنتج"],["كود","الكود"],["purchase_price","الشراء"],["selling_price","البيع"]]);
}
async function addCustomer(){
 const name=document.getElementById("cname").value.trim();
 if(!name)return msg("اكتب اسم العميل");
 const {error}=await db.from("customers").insert({
  name,phone:document.getElementById("cphone").value.trim(),
  address:document.getElementById("caddress").value.trim(),
  notes:document.getElementById("cnotes").value.trim()
 });
 if(error)return msg(error.message);
 ["cname","cphone","caddress","cnotes"].forEach(id=>document.getElementById(id).value="");
 msg("تم حفظ العميل");loadCustomers();loadStats();
}
async function loadCustomers(){
 const {data,error}=await db.from("customers").select("name,phone,address,created_at").order("created_at",{ascending:false});
 document.getElementById("customersList").innerHTML=error?safe(error.message):
 table(data,[["name","الاسم"],["phone","الهاتف"],["address","العنوان"]]);
}
async function addSupplier(){
 const name=document.getElementById("sname").value.trim();
 if(!name)return msg("اكتب اسم المورد");
 const {error}=await db.from("suppliers").insert({
  name,phone:document.getElementById("sphone").value.trim(),
  address:document.getElementById("saddress").value.trim()
 });
 if(error)return msg(error.message);
 ["sname","sphone","saddress"].forEach(id=>document.getElementById(id).value="");
 msg("تم حفظ المورد");loadSuppliers();
}
async function loadSuppliers(){
 const {data,error}=await db.from("suppliers").select("name,phone,address").order("created_at",{ascending:false});
 document.getElementById("suppliersList").innerHTML=error?safe(error.message):
 table(data,[["name","المورد"],["phone","الهاتف"],["address","العنوان"]]);
}
async function addExpense(){
 const title=document.getElementById("etitle").value.trim();
 const amount=Number(document.getElementById("eamount").value);
 if(!title || !Number.isFinite(amount) || amount<0)return msg("راجع اسم المصروف والمبلغ");
 const {error}=await db.from("expenses").insert({
  title,amount,payment_method:document.getElementById("epayment").value,
  notes:document.getElementById("enotes").value.trim()
 });
 if(error)return msg(error.message);
 ["etitle","eamount","enotes"].forEach(id=>document.getElementById(id).value="");
 msg("تم تسجيل المصروف");loadExpenses();loadStats();
}
async function loadExpenses(){
 const {data,error}=await db.from("expenses").select("title,amount,payment_method,created_at").order("created_at",{ascending:false}).limit(100);
 document.getElementById("expensesList").innerHTML=error?safe(error.message):
 table((data||[]).map(x=>({...x,amount:money(x.amount)})),[["title","البيان"],["amount","المبلغ"],["payment_method","طريقة الدفع"],["created_at","التاريخ"]]);
}
async function loadInvoices(){
 const {data,error}=await db.from("invoices").select("invoice_number,invoice_type,total,paid,payment_method,status,created_at").order("created_at",{ascending:false}).limit(100);
 document.getElementById("invoicesList").innerHTML=error?safe(error.message):
 table((data||[]).map(x=>({...x,total:money(x.total),paid:money(x.paid)})),[["invoice_number","رقم الفاتورة"],["invoice_type","النوع"],["total","الإجمالي"],["paid","المدفوع"],["payment_method","الدفع"],["status","الحالة"],["created_at","التاريخ"]]);
}
async function loadStock(){
 const {data,error}=await db.from("inventory_balance").select("product_name,product_code,current_stock").order("product_name");
 document.getElementById("stockList").innerHTML=error?safe(error.message):
 table(data,[["product_name","المنتج"],["product_code","الكود"],["current_stock","الرصيد"]]);
}
async function loadReports(){
 const today=new Date();today.setHours(0,0,0,0);
 const {data:inv,error:e1}=await db.from("invoices").select("total,paid,created_at,status").gte("created_at",today.toISOString()).eq("status","approved");
 const {data:exp,error:e2}=await db.from("expenses").select("amount,created_at").gte("created_at",today.toISOString());
 if(e1||e2){document.getElementById("reportsList").textContent=(e1||e2).message;return;}
 const sales=(inv||[]).reduce((s,x)=>s+Number(x.total||0),0);
 const paid=(inv||[]).reduce((s,x)=>s+Number(x.paid||0),0);
 const expenses=(exp||[]).reduce((s,x)=>s+Number(x.amount||0),0);
 document.getElementById("reportsList").innerHTML=
 `<div class="stat">مبيعات اليوم<h2>${money(sales)}</h2></div>
 <div class="stat">المتحصل اليوم<h2>${money(paid)}</h2></div>
 <div class="stat">مصروفات اليوم<h2>${money(expenses)}</h2></div>
 <p>التقارير الحالية تعرض ملخص اليوم. سنضيف الأسبوع والشهر بعد اختبار الاتصال.</p>`;
}
db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_IN" && session) startApp();
});
startApp();
</script>
</body>
</html>
